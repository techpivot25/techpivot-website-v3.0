          script.async = true;
          document.head.appendChild(script);
          
          script.onload = function() {
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', 'G-X2VGF6SLHD');
          };
        }, 2000); // 2 second delay after page load
      });
    </script>
